<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9b8ff"/>
      <stop offset="1" stop-color="#ffc4dc"/>
    </linearGradient>
    <linearGradient id="fluff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece6ff"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#sky)"/>
  <!-- little sparkles -->
  <path d="M15 18l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#fff" opacity=".85"/>
  <path d="M84 14l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1z" fill="#fff" opacity=".75"/>
  <!-- raindrops -->
  <path d="M30 76q-3 5 0 7 3-2 0-7z" fill="#8fb8ff"/>
  <path d="M50 80q-3 5 0 7 3-2 0-7z" fill="#8fb8ff"/>
  <path d="M70 76q-3 5 0 7 3-2 0-7z" fill="#8fb8ff"/>
  <!-- the cloud -->
  <path d="M22 70h56a14 14 0 0 0 2-27.8A20 20 0 0 0 42 34a15 15 0 0 0-20 13.5A11.5 11.5 0 0 0 22 70z"
        fill="url(#fluff)" stroke="#b49cff" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- face -->
  <ellipse cx="41" cy="54" rx="3.2" ry="3.8" fill="#3b3554"/>
  <ellipse cx="59" cy="54" rx="3.2" ry="3.8" fill="#3b3554"/>
  <circle cx="42.2" cy="52.6" r="1.1" fill="#fff"/>
  <circle cx="60.2" cy="52.6" r="1.1" fill="#fff"/>
  <circle cx="34" cy="61" r="3.6" fill="#fbb6ce" opacity=".85"/>
  <circle cx="66" cy="61" r="3.6" fill="#fbb6ce" opacity=".85"/>
  <path d="M46 61q4 4 8 0" fill="none" stroke="#3b3554" stroke-width="2" stroke-linecap="round"/>
  <!-- a rose tucked behind the ear -->
  <g transform="translate(70 34)">
    <path d="M-2 6q-6 3-8 0 4-3 8 0z" fill="#6cbf7a" stroke="#3f8a50" stroke-width=".8"/>
    <circle r="7" fill="#e8587a" stroke="#b8325a" stroke-width="1.2"/>
    <path d="M-3.5-1c1-3.5 7-3.5 7 .5 0 3-4.5 3.5-5 .5 0-1.8 2.2-2.2 2.8-.6" fill="none" stroke="#b8325a" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
